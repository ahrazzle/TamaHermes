[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tamahermes"
version = "1.2.2"
description = "TamaHermes: a Tamagotchi-style desktop pet for Hermes Agent, forked from Tamacodex. Grows from real agent activity — in the terminal, and floating on the desktop."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]
authors = [{ name = "ahrazzle" }, { name = "Alichua (upstream Tamacodex)" }]
license = { text = "MIT" }
keywords = ["hermes-agent", "desktop-pet", "pixel-art", "tamagotchi", "codex"]

[project.scripts]
tamahermes = "tamahermes.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tamahermes*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tamahermes = [
  "catalog_assets/**/*",
  "sfx/*.wav",
  "sfx/*.md",
  "native_overlay/*.swift",
]
tamahermes_gen = [
  "SKILL.md",
  "profiles/*.json",
  "references/*.md",
]
