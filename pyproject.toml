[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tamacodex"
version = "1.0.0"
description = "TamaHermes: a Tamacodex desktop pet for Hermes Agent. Grows from real agent activity — in the terminal, and floating on the desktop."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]
authors = [{ name = "Alichua" }]
license = { text = "MIT" }
keywords = ["codex", "desktop-pet", "pixel-art", "tamagotchi"]

[project.scripts]
tamacodex = "tamacodex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tamacodex*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tamacodex = [
  "catalog_assets/**/*",
  "sfx/*.wav",
  "sfx/*.md",
  "native_overlay/*.swift",
]
tamacodex_gen = [
  "SKILL.md",
  "profiles/*.json",
  "references/*.md",
]
